    Balance: 250
  status: pass
elements:
- type: locked
  location:
    snippet: |-
      class BankAccount {
          constructor(owner, balance) {
              this.owner = owner;
              this.balance = balance;
          }

          deposit(amount) {
              if (amount > 0) {
                  this.balance = this.balance + amount;
                  console.log(`Deposited ${amount}`);
              }
              return this.balance;
          }

          withdraw(amount) {
              if (0 < amount && amount <= this.balance) {
                  this.balance = this.balance - amount;
                  console.log(`Withdrew ${amount}`);
              } else {
                  console.log("Insufficient funds");
              }
              return this.balance;
          }
      }
- type: editable
  location:
    snippet: |2-
