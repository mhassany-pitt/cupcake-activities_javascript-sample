runtime:
  language: javascript
statement: |
  Implement a `transfer` sequence or method in `main` to move money from one `BankAccount` to another.
  Ensure that money is withdrawn from the current account only if funds are sufficient, and deposited into the target account.
executions:
  - title: Transfer Alice to Bob
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: locked
    location:
      snippet: |-
        class BankAccount {
            constructor(owner, balance) {
                this.owner = owner;
                this.balance = balance;
            }

            deposit(amount) {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    console.log(`Deposited ${amount}`);
                }
                return this.balance;
            }

            withdraw(amount) {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    console.log(`Withdrew ${amount}`);
                } else {
                    console.log("Insufficient funds");
                }
                return this.balance;
            }
        }
  - type: editable
    location:
      snippet: |-
        const account = new BankAccount("Bob", 200);
            account.deposit(100);
            account.withdraw(50);
            console.log(`Balance: ${account.balance}`);
    placeholder: |-
      // Implement transfer sequence here
          // Then test it with acc1 and acc2
