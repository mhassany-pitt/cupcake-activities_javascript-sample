include_choices: 4
question: |
  Given the following JavaScript ES6 class definition:
  
  ```javascript
  class BankAccount {
      constructor(owner, balance) {
          this.owner = owner;
          this.balance = balance;
      }
  }
  ```
  
  Which of the following represents the correct implementation for a `deposit` method in `BankAccount` that validates positive deposit amounts, modifies the instance balance, and returns the new balance?
choices:
  - body: |
      ```javascript
      deposit(amount) {
          if (amount > 0) {
              this.balance += amount;
              return this.balance;
          }
          throw new Error("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Verifies that the deposit `amount` is strictly positive (`amount > 0`).
          2. Mutates instance state using `this.balance += amount`.
          3. Returns the updated balance.
          4. Throws a descriptive `Error` if the deposit amount is not positive.
  - body: |
      ```javascript
      deposit(amount) {
          if (amount > 0) {
              let balance = this.balance + amount;
              return balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Declaring `let balance = ...` creates a temporary block-scoped local variable instead of updating the instance property `this.balance`, leaving the account balance unmodified.
  - body: |
      ```javascript
      deposit(amount) {
          if (amount > 0) {
              this.balance =+ amount;
              return this.balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`this.balance = +amount`), which replaces and overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```javascript
      deposit(amount) {
          if (amount > 0) {
              balance += amount;
              return balance;
          }
          return balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In JavaScript class methods, instance properties must be referenced using `this.balance`. Omitting `this.` causes a runtime `ReferenceError: balance is not defined`.
