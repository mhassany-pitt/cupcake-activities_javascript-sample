$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/code-completion/0.1.0
source: main.js
license: MIT
locale: en-US
id: cc_bank_account
title: Complete the BankAccount JavaScript Implementation
description: Fill in the essential JavaScript ES6 keywords, operators, and method calls to declare classes, update state, and validate transactions.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - classes
    - arithmetic
    - relational-operators
    - methods
runtime:
  language: javascript
statement: |
  Complete the `BankAccount` class implementation by selecting the correct keywords, operators, and method identifiers.
  Make sure to:
  1. Declare the blueprint using the modern ES6 class keyword.
  2. Correctly increment the balance during a deposit.
  3. Ensure that withdrawal requests do not exceed the available balance.
  4. Invoke the proper transaction method in the `main` driver function.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    stderr: ''
    status: pass
elements:
  - type: blank
    location:
      context: class BankAccount {
      snippet: class
      nth: 1
    choices:
      - snippet: class
        role: solution
        explanations:
          - body: |
              Correct! In modern JavaScript (ES6+), the `class` keyword is used to declare an object blueprint containing constructors and methods.
      - snippet: function
        role: distractor
        explanations:
          - body: |
              Incorrect. While `function` was used for constructor functions in older ES5 syntax, it does not support modern ES6 class body syntax (`constructor(...) { ... }`).
      - snippet: object
        role: distractor
        explanations:
          - body: |
              Incorrect. `object` is not a JavaScript declaration keyword. Object literals use `{}` rather than `object Name { ... }`.
      - snippet: interface
        role: distractor
        explanations:
          - body: |
              Incorrect. `interface` is a TypeScript compile-time feature and is not a valid declaration keyword in standard JavaScript.
  - type: blank
    location:
      context: this.balance = this.balance + amount;
      snippet: +
      nth: 1
    choices:
      - snippet: +
        role: solution
        explanations:
          - body: |
              Correct! The addition operator (`+`) adds the deposited `amount` to the current `this.balance`, increasing total funds.
      - snippet: '-'
        role: distractor
        explanations:
          - body: |
              Incorrect. The subtraction operator (`-`) would deduct money from the account during a deposit instead of adding to it.
      - snippet: '*'
        role: distractor
        explanations:
          - body: |
              Incorrect. The multiplication operator (`*`) would multiply the existing balance by the deposit amount, yielding an incorrect total.
      - snippet: '='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `=` here would result in invalid assignment syntax or overwrite the balance with `amount` rather than accumulating funds.
  - type: blank
    location:
      context: if (0 < amount && amount <= this.balance) {
      snippet: <=
      nth: 1
    choices:
      - snippet: <=
        role: solution
        explanations:
          - body: |
              Correct! The less-than-or-equal operator (`<=`) ensures the user has sufficient funds, allowing withdrawals up to and including the exact total balance without overdrafting.
      - snippet: <
        role: distractor
        explanations:
          - body: |
              Incorrect. The strictly-less-than operator (`<`) would prevent account holders from withdrawing their exact entire balance (withdrawing down to zero).
      - snippet: '>='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>=` would invert the business logic, permitting withdrawals only when the amount is greater than or equal to the balance, guaranteeing an overdraft.
      - snippet: '>'
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>` would only permit transactions that exceed the current balance, causing an immediate overdraft into negative funds.
  - type: blank
    location:
      context: account.deposit(100);
      snippet: deposit
      nth: 1
    choices:
      - snippet: deposit
        role: solution
        explanations:
          - body: |
              Correct! Invokes the `deposit` method with an argument of `100` to credit the account.
      - snippet: withdraw
        role: distractor
        explanations:
          - body: |
              Incorrect. Invoking `withdraw(100)` would debit the account instead of performing the required deposit transaction.
      - snippet: balance
        role: distractor
        explanations:
          - body: |
              Incorrect. `balance` is a numeric property, not a callable function; attempting `account.balance(100)` throws a `TypeError: account.balance is not a function`.
