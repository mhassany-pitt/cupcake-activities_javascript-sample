$schema: https://learning-contents.org/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: main.js
title: Bank Account Methods and Constructor in JavaScript
description: Rearrange the JavaScript ES6 methods and constructor to properly manage BankAccount instance state and enforce transaction safety.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - conditional-logic
    - variable-scope
runtime:
  language: javascript
statement: |
  Rearrange the blocks to correctly implement the constructor and methods for the `BankAccount` class in JavaScript.
  Make sure to:
  1. Initialize the instance properties (`owner` and `balance`) using `this`.
  2. Implement the `deposit` method with positive input validation.
  3. Implement the `withdraw` method with strict overdraft protection and insufficient funds notification.
executions:
  - title: Standard Transaction
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: block
    group: bank-members
    location:
      snippet: |2-
            constructor(owner, balance) {
                this.owner = owner;
                this.balance = balance;
            }
    choices:
      - snippet: |2-
              constructor(owner, balance) {
                  this.owner = owner;
                  this.balance = balance;
              }
        role: solution
        explanations:
          - body: |
              Correct! Uses `this.owner = owner` and `this.balance = balance` to bind constructor argument values to the new instance properties.
      - snippet: |-
          constructor(owner, balance) {
              owner = owner;
              balance = balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Without the `this.` prefix, `owner = owner` assigns constructor parameters back to themselves without updating the actual instance properties `this.owner` and `this.balance`.
  - type: block
    group: bank-members
    location:
      snippet: |2-
            deposit(amount) {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    console.log(`Deposited ${amount}`);
                }
                return this.balance;
            }
    choices:
      - snippet: |2-
              deposit(amount) {
                  if (amount > 0) {
                      this.balance = this.balance + amount;
                      console.log(`Deposited ${amount}`);
                  }
                  return this.balance;
              }
        role: solution
        explanations:
          - body: |
              Correct! Validates that `amount > 0` before updating `this.balance`, logs the confirmation message, and returns the updated balance.
  - type: block
    group: bank-members
    location:
      snippet: |2-
            withdraw(amount) {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    console.log(`Withdrew ${amount}`);
                } else {
                    console.log("Insufficient funds");
                }
                return this.balance;
            }
    choices:
      - snippet: |2-
              withdraw(amount) {
                  if (0 < amount && amount <= this.balance) {
                      this.balance = this.balance - amount;
                      console.log(`Withdrew ${amount}`);
                  } else {
                      console.log("Insufficient funds");
                  }
                  return this.balance;
              }
        role: solution
        explanations:
          - body: |
              Correct! Verifies that `0 < amount` and `amount <= this.balance`, debits the account when funds are sufficient, logs an error when funds are insufficient, and returns `this.balance`.
      - snippet: |-
          withdraw(amount) {
              this.balance = this.balance - amount;
              console.log(`Withdrew ${amount}`);
              return this.balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Unconditionally deducts `amount` without verifying if `amount <= this.balance`, allowing the account balance to plunge into negative numbers.
